<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espaço de Escuta</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --primary-color: #5b8296;
            --secondary-color: #799fcb;
            --accent-color: #cdd1c4;
            --text-main: #2b3a42;
            --text-muted: #62727b;
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-family);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header-art {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 40px 30px;
            text-align: center;
            position: relative;
        }

        .header-art h1 {
            font-size: 2.2rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .header-art p {
            font-size: 1.1rem;
            opacity: 0.9;
            font-weight: 300;
        }

        .content-section {
            padding: 40px 30px;
        }

        .intro-text {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 1.05rem;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-main);
        }

        input[type="text"],
        input[type="email"],
        textarea {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e0e6ed;
            border-radius: 12px;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            outline: none;
            background-color: #fafbfc;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        textarea:focus {
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 4px rgba(121, 159, 203, 0.15);
            background-color: #fff;
        }

        textarea {
            resize: vertical;
            min-height: 140px;
        }

        .submit-btn {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
        }

        .submit-btn:hover {
            background-color: #4a6e82;
        }

        .submit-btn:active {
            transform: scale(0.99);
        }

        .footer-note {
            text-align: center;
            margin-top: 25px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        @media (max-width: 600px) {
            .header-art h1 {
                font-size: 1.8rem;
            }
            .content-section {
                padding: 25px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="header-art">
            <h1>Espaço de Escuta</h1>
            <p>Um ambiente seguro para você compartilhar o que desejar.</p>
        </header>

        <section class="content-section">
            <p class="intro-text">
                Escreva abaixo o que você gostaria de expressar. Este canal é totalmente reservado para o seu momento.
            </p>

            <form action="#" method="POST">
                <div class="form-group">
                    <label for="nome">Como gostaria de ser chamado(a)? (Opcional)</label>
                    <input type="text" id="nome" name="nome" placeholder="Seu nome ou apelido">
                </div>

                <div class="form-group">
                    <label for="email">E-mail para contato (Opcional)</label>
                    <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com">
                </div>

                <div class="form-group">
                    <label for="mensagem">Sua mensagem</label>
                    <textarea id="mensagem" name="mensagem" required placeholder="Digite aqui o que você está sentindo ou pensando..."></textarea>
                </div>

                <button type="submit" class="submit-btn">Enviar Mensagem</button>
            </form>

            <p class="footer-note">
                Sua privacidade e bem-estar são prioridades.
            </p>
        </section>
    </div>

</body>
</html>
